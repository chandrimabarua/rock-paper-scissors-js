    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    
    </head>
    <body>
    <div class="container">
        <header>
        <h1>👊 Rock Paper Scissors ✋</h1>
        </header>

        <section class="score-board">
        <div class="card">
            <label>You</label>
            <span id="user-score" class="value">0</span>
        </div>
        <div class="card">
            <label>Computer</label>
            <span id="computer-score" class="value">0</span>
        </div>
        <div class="card">
            <label>Draw</label>
            <span id="draw-score" class="value">0</span>
        </div>
        </section>

        <section class="choices">
        <button class="choice-btn" data-choice="rock" aria-label="rock">👊</button>
        <button class="choice-btn" data-choice="paper" aria-label="paper">✋</button>
        <button class="choice-btn" data-choice="scissors" aria-label="scissors">✌️</button>
        </section>

        <section class="result">
        <div class="result-display">
            <div class="player">
            <label>You</label>
            <span id="user-choice" class="emoji">❓</span>
            </div>
            <div class="vs">vs</div>
            <div class="player">
            <label>Computer</label>
            <span id="computer-choice" class="emoji">❓</span>
            </div>
        </div>
        <p id="status-message" class="status-message">Choose your move 🚀</p>
        </section>

        <section class="stats">
        <div class="card">
            <label>Total Games</label>
            <span id="total-games" class="value">0</span>
        </div>
        <div class="card">
            <label>Win Rate</label>
            <span id="win-rate" class="value">0%</span>
        </div>
        <div class="card">
            <label>Best Streak</label>
            <span id="best-streak" class="value">0</span>
        </div>
        </section>

        <div class="actions">
        <button id="reset-btn" class="reset-btn">Reset Game</button>
        </div>

        <section class="history">
        <h2>Match History</h2>
        <ul id="history-list">
            <li class="history-empty">No games yet</li>
        </ul>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
    </body>
    </html>
